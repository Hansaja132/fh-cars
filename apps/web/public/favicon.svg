<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Speedometer Primary Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#356FE6" />
      <stop offset="50%" stop-color="#00B8D9" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="#263341" stroke-width="8" fill="none" opacity="0.8" />

  <!-- Outer Gauge Arc -->
  <path 
    d="M 110 370 A 180 180 0 1 1 402 370" 
    stroke="#1E293B" 
    stroke-width="32" 
    stroke-linecap="round" 
    fill="none" 
  />

  <!-- Active Glowing Speedometer Track -->
  <path 
    d="M 110 370 A 180 180 0 1 1 370 170" 
    stroke="url(#accent-grad)" 
    stroke-width="36" 
    stroke-linecap="round" 
    fill="none"
    filter="url(#cyan-glow)"
  />

  <!-- Tachometer Tick Marks -->
  <line x1="145" y1="335" x2="165" y2="315" stroke="#64748B" stroke-width="8" stroke-linecap="round" />
  <line x1="115" y1="256" x2="143" y2="256" stroke="#64748B" stroke-width="8" stroke-linecap="round" />
  <line x1="145" y1="177" x2="165" y2="197" stroke="#64748B" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="115" x2="256" y2="143" stroke="#00B8D9" stroke-width="10" stroke-linecap="round" />
  <line x1="367" y1="177" x2="347" y2="197" stroke="#356FE6" stroke-width="10" stroke-linecap="round" />

  <!-- Gauge Needle Hub -->
  <circle cx="256" cy="300" r="32" fill="#0F172A" stroke="#00B8D9" stroke-width="12" filter="url(#cyan-glow)" />

  <!-- Speedometer Needle -->
  <path 
    d="M 250 295 L 340 160 Q 345 152 352 160 L 262 305 Z" 
    fill="url(#accent-grad)" 
    filter="url(#cyan-glow)"
  />
  <circle cx="256" cy="300" r="12" fill="#FFFFFF" />

  <!-- FH Brand Accent Lettering overlay (crisp FH6) -->
  <text 
    x="256" 
    y="440" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="64" 
    fill="#F1F5F9" 
    text-anchor="middle" 
    letter-spacing="6"
  >FH6</text>
</svg>
